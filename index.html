<!doctype html>
<html lang="en" data-mode="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Colour of the phone's browser bar; app.js changes it to black in night mode. -->
  <meta name="theme-color" content="#0b1020">
  <!-- Only load things from this site itself, plus the data sources proven in Step 1 as each step needs them.
       Sun photos (Step 4): Helioviewer, and NASA SDO as the backup. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://api.helioviewer.org https://sdo.gsfc.nasa.gov">
  <title>Sky</title>
  <!-- Must load before anything is drawn (not deferred), so night mode starts red with no blue flash. -->
  <script src="js/early-mode.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="titles">
      <h1 id="screen-title">Tonight</h1>
      <p id="screen-subtitle" class="subtitle"></p>
    </div>
    <button id="night-toggle" class="night-toggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      <span id="night-label">Night</span>
    </button>
  </header>

  <main id="screen" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#tonight" data-tab="tonight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <span>Tonight</span>
    </a>
    <a href="#modes" data-tab="modes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
      <span>Modes</span>
    </a>
    <a href="#space" data-tab="space">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c3 3 4.5 6.5 4.5 10.5L14 17h-4l-2.5-4.5C7.5 8.5 9 5 12 2z"/><circle cx="12" cy="9.5" r="1.8"/><path d="M10 17l-1 5 3-2 3 2-1-5"/></svg>
      <span>Space</span>
    </a>
    <a href="#trivia" data-tab="trivia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.7.5 1 1.2 1 2.1h5c0-.9.3-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      <span>Trivia</span>
    </a>
    <a href="#log" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg>
      <span>Log</span>
    </a>
  </nav>
</body>
</html>
